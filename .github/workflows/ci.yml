name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: chat_dev_password
          POSTGRES_DB: chatdb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat -d chatdb" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgres://chat:chat_dev_password@localhost:5432/chatdb
      READONLY_DATABASE_URL: postgresql://bot_reader:bot_reader_dev@localhost:5432/chatdb
      PGPASSWORD: chat_dev_password
    steps:
      - uses: actions/checkout@v4

      - name: Load database schema
        run: |
          psql -h localhost -U chat -d chatdb -v ON_ERROR_STOP=1 -f db/01-schema.sql
          POSTGRES_USER=chat POSTGRES_DB=chatdb PGHOST=localhost bash db/02-readonly-role.sh

      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: chat-server tests
        working-directory: chat-server
        run: npm install && npm test

      - name: client build
        working-directory: client
        run: npm install && npm run build

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: bot-service tests
        working-directory: bot-service
        env:
          LLM_PROVIDER: fake
          KAFKA_ENABLED: "false"
        run: |
          pip install -r requirements.txt pytest httpx reportlab
          pytest -q
